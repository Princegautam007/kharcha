name: Parser tests

on:
  pull_request:

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run parser tests
        run: node --test tests/parser.test.js
