name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run all test suites
        # Bash expands the glob so every tests/*.test.js file runs: the
        # node:test suites and the plain mini-test scripts alike. A failure
        # in any suite fails the build.
        run: node --test tests/*.test.js
